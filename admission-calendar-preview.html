/* =========================================================================
   BANGLA NUMERALS / DATE FORMAT
   ========================================================================= */
const BN_DIGITS = { "0":"০","1":"১","2":"২","3":"৩","4":"৪","5":"৫","6":"৬","7":"৭","8":"৮","9":"৯" };
function toBanglaNumber(value) { return String(value).replace(/[0-9]/g, (d) => BN_DIGITS[d]); }
const BN_MONTHS = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
function formatBanglaDate(iso) {
  if (!iso) return null;
  const [y, m, d] = iso.split("-").map(Number);
  if (!y || !m || !d) return null;
  return `${toBanglaNumber(d)} ${BN_MONTHS[m - 1]} ${toBanglaNumber(y)}`;
}

/* =========================================================================
   DATE MATH (Asia/Dhaka)
   ========================================================================= */
function getDhakaTodayISO() {
  const formatter = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Dhaka", year: "numeric", month: "2-digit", day: "2-digit" });
  return formatter.format(new Date());
}
function isoToUtcMidnight(iso) { const [y, m, d] = iso.split("-").map(Number); return Date.UTC(y, m - 1, d); }
function diffInDays(a, b) { return Math.round((isoToUtcMidnight(b) - isoToUtcMidnight(a)) / 86400000); }
function isSameDay(a, b) { return a === b; }
function isBefore(a, b) { return isoToUtcMidnight(a) < isoToUtcMidnight(b); }
function isAfter(a, b) { return isoToUtcMidnight(a) > isoToUtcMidnight(b); }
function daysUntil(today, target) { return diffInDays(today, target); }

function useToday() {
  const [today, setToday] = useState(getDhakaTodayISO);
  useEffect(() => {
    const now = new Date();
    const dhakaNow = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Dhaka" }));
    const msUntilMidnight = new Date(dhakaNow.getFullYear(), dhakaNow.getMonth(), dhakaNow.getDate() + 1, 0, 0, 5).getTime() - dhakaNow.getTime();
    const t = setTimeout(() => setToday(getDhakaTodayISO()), Math.max(msUntilMidnight, 1000));
    return () => clearTimeout(t);
  }, [today]);
  return today;
}

/* =========================================================================

   ========================================================================= */
const STATUS_STYLES = {
  "not-started": { labelBn: "আবেদন শুরু হয়নি", className: "bg-slate-100 text-slate-600 border-slate-200" },
  ongoing: { labelBn: "আবেদন চলছে", className: "bg-emerald-100 text-emerald-700 border-emerald-200" },
  "last-day": { labelBn: "আবেদনের শেষ দিন আজ", className: "bg-rose-100 text-rose-700 border-rose-200" },
  closed: { labelBn: "আবেদন শেষ", className: "bg-slate-100 text-slate-600 border-slate-200" },
  "upcoming-exam": { labelBn: "ভর্তি পরীক্ষা আসন্ন", className: "bg-amber-100 text-amber-700 border-amber-200" },
  "exam-today": { labelBn: "আজ ভর্তি পরীক্ষা", className: "bg-gradient-to-r from-rose-600 to-orange-500 text-white border-transparent" },
  completed: { labelBn: "পরীক্ষা সম্পন্ন", className: "bg-slate-100 text-slate-500 border-slate-200" },
  unpublished: { labelBn: "তথ্য প্রকাশিত হয়নি", className: "bg-slate-50 text-slate-400 border-slate-200" },
};
function computeStatus(unit, today) {
  const { applicationStart, applicationEnd, examDate } = unit;
  const build = (status) => ({ status, ...STATUS_STYLES[status] });
  if (!applicationStart && !applicationEnd && !examDate) return build("unpublished");
  if (examDate && isSameDay(today, examDate)) return build("exam-today");
  if (examDate && isAfter(today, examDate)) return build("completed");
  if (applicationEnd && isSameDay(today, applicationEnd)) return build("last-day");
  if (applicationStart && isBefore(today, applicationStart)) return build("not-started");
  if (applicationStart && applicationEnd && !isBefore(today, applicationStart) && isBefore(today, applicationEnd)) return build("ongoing");
  if (applicationEnd && isAfter(today, applicationEnd)) {
    if (examDate) { const d = daysUntil(today, examDate); if (d <= 15) return build("upcoming-exam"); }
    return build("closed");
  }
  if (examDate && isBefore(today, examDate)) return build("upcoming-exam");
  return build("unpublished");
}
function computeCountdown(unit, today) {
  if (!unit.examDate) return { labelBn: "তথ্য প্রকাশিত হয়নি", daysLeft: null, className: "bg-slate-50 text-slate-400 border-slate-200" };
  const daysLeft = daysUntil(today, unit.examDate);
  if (daysLeft < 0) return { labelBn: "পরীক্ষা সম্পন্ন", daysLeft, className: "bg-slate-100 text-slate-500 border-slate-200" };
  if (daysLeft === 0) return { labelBn: "আজ পরীক্ষা", daysLeft, className: "bg-gradient-to-r from-rose-600 to-orange-500 text-white border-transparent font-semibold" };
  if (daysLeft === 1) return { labelBn: "আগামীকাল", daysLeft, className: "bg-rose-100 text-rose-700 border-rose-200 font-semibold" };
  const label = `আর ${toBanglaNumber(daysLeft)} দিন`;
  if (daysLeft < 7) return { labelBn: label, daysLeft, className: "bg-rose-50 text-rose-700 border-rose-200" };
  if (daysLeft < 15) return { labelBn: label, daysLeft, className: "bg-amber-50 text-amber-700 border-amber-200" };
  return { labelBn: label, daysLeft, className: "bg-sky-50 text-sky-700 border-sky-200" };
}
function computeDeadlineDaysLeft(unit, today) {
  if (!unit.applicationEnd) return null;
  return daysUntil(today, unit.applicationEnd);
}

/* =========================================================================
   FLATTEN / SUMMARY / FILTERS
   ========================================================================= */
function flattenUnits(list) {
  const rows = [];
  for (const university of list) for (const unit of university.units) rows.push({ university, unit });
  return rows;
}
function computeSummaryStats(list, rows, today) {
  let ongoingCount = 0, upcomingExamCount = 0, examsThisWeekCount = 0;
  for (const { unit } of rows) {
    const { status } = computeStatus(unit, today);
    if (status === "ongoing" || status === "last-day") ongoingCount++;
    if (status === "upcoming-exam" || status === "exam-today") upcomingExamCount++;
    if (unit.examDate) { const d = daysUntil(today, unit.examDate); if (d >= 0 && d <= 7) examsThisWeekCount++; }
  }
  return { totalInstitutions: list.length, ongoingCount, upcomingExamCount, examsThisWeekCount };
}
function getUpcomingExams(rows, today, limit) {
  return rows.filter((r) => r.unit.examDate && daysUntil(today, r.unit.examDate) >= 0)
    .sort((a, b) => daysUntil(today, a.unit.examDate) - daysUntil(today, b.unit.examDate)).slice(0, limit);
}
function getUrgentDeadlines(rows, today, withinDays) {
  return rows.filter((r) => { const d = computeDeadlineDaysLeft(r.unit, today); return d !== null && d >= 0 && d <= withinDays; })
    .sort((a, b) => computeDeadlineDaysLeft(a.unit, today) - computeDeadlineDaysLeft(b.unit, today));
}
function searchRows(rows, query) {
  const q = query.trim().toLowerCase();
  if (!q) return rows;
  return rows.filter(({ university, unit }) => {
    const category = getCategoryById(university.category);
    const hay = [university.nameBn, university.nameEn, university.shortName, unit.nameBn || "", category?.nameBn || "", category?.shortNameBn || ""].join(" ").toLowerCase();
    return hay.includes(q);
  });
}
function filterByStatus(rows, filter, today) {
  if (filter === "all") return rows;
  return rows.filter((r) => {
    const { status } = computeStatus(r.unit, today);
    if (filter === "ongoing") return status === "ongoing" || status === "last-day";
    if (filter === "upcoming-exam") return status === "upcoming-exam" || status === "exam-today";
    if (filter === "closed") return status === "closed";
    if (filter === "completed") return status === "completed";
    return true;
  });
}
function dayRank(daysLeft) { if (daysLeft === null) return Infinity; if (daysLeft >= 0) return daysLeft; return 100000 - daysLeft; }
function sortRows(rows, key, today) {
  const sorted = [...rows];
  if (key === "name") { sorted.sort((a, b) => a.university.nameBn.localeCompare(b.university.nameBn, "bn")); return sorted; }
  if (key === "application-deadline") { sorted.sort((a, b) => dayRank(computeDeadlineDaysLeft(a.unit, today)) - dayRank(computeDeadlineDaysLeft(b.unit, today))); return sorted; }
  sorted.sort((a, b) => {
    const da = a.unit.examDate ? daysUntil(today, a.unit.examDate) : null;
    const db = b.unit.examDate ? daysUntil(today, b.unit.examDate) : null;
    return dayRank(da) - dayRank(db);
  });
  return sorted;
}

    }
  }, [jumpToUniversityId]);

  const universityList = useMemo(() => (selectedCategory ? getUniversitiesByCategory(selectedCategory) : []), [selectedCategory]);
  const category = selectedCategory ? getCategoryById(selectedCategory) : null;
  const selectedUniversity = selectedUniversityId ? getUniversityById(selectedUniversityId) : null;
  return (
    <div className="space-y-5">
      {!selectedCategory ? <CategoryGrid onSelect={setSelectedCategory} /> : !selectedUniversity ? (
        <React.Fragment>
          <CategoryPills active={selectedCategory} onSelect={(id) => { setSelectedCategory(id); setSelectedUniversityId(null); }} onBack={() => setSelectedCategory(null)} />
          <div>
            <h2 className="mb-3 text-sm font-bold text-navy-900 sm:text-base">{category?.nameBn}</h2>
            {universityList.length === 0 ? <EmptyState title="এই ক্যাটাগরিতে কোনো তথ্য পাওয়া যায়নি" /> : <UniversityPicker universityList={universityList} onSelect={setSelectedUniversityId} />}
          </div>
        </React.Fragment>
      ) : (
        <div>
          <button onClick={() => setSelectedUniversityId(null)} className="mb-4 inline-flex items-center gap-1.5 text-sm font-medium text-indigo-600 hover:text-indigo-800"><IconArrowLeft className="h-4 w-4" />তালিকায় ফিরে যান</button>
          <UniversityInfoPanel university={selectedUniversity} />
        </div>
      )}
    </div>
  );
}

/* =========================================================================
   APP
   ========================================================================= */
function App() {
  const [activeTab, setActiveTab] = useState("overview");
  const [jumpToUniversityId, setJumpToUniversityId] = useState(null);
  const openUniversityInInfoTab = (id) => { setJumpToUniversityId(id); setActiveTab("info"); };
  // Tab switches replace the whole panel below the sticky nav, so always
  // reset scroll to top — otherwise a switch triggered from far down a long
  // list (e.g. a table row's "বিস্তারিত" button) leaves new content hidden
  // underneath the sticky header/tabs bar.
  useEffect(() => { window.scrollTo(0, 0); }, [activeTab]);
  return (
    <div className="flex min-h-screen flex-col">
      <Header />
      <MainTabs active={activeTab} onChange={setActiveTab} />
      <main className="mx-auto w-full max-w-7xl flex-1 px-4 py-5 sm:px-6 sm:py-6">
        {activeTab === "overview" && <CalendarTab onOpenUniversity={openUniversityInInfoTab} />}
        {activeTab === "category" && <CategoryTab onOpenUniversity={openUniversityInInfoTab} />}
        {activeTab === "info" && <InfoTab jumpToUniversityId={jumpToUniversityId} onConsumeJump={() => setJumpToUniversityId(null)} />}
      </main>
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
